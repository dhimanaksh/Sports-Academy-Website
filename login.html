
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>EliteEdge Sports Academy – Login</title>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow:wght@300;400;600;700&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
 
    :root {
      --red: #e8192c;
      --dark: #0a0a0a;
      --darker: #060606;
      --card: #111111;
      --border: #1e1e1e;
      --text: #f0f0f0;
      --muted: #888;
      --accent: #ff4d5e;
    }
 
    body {
      font-family: 'Barlow', sans-serif;
      background: var(--darker);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      position: relative;
    }
 
    /* Animated background */
    .bg-grid {
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(rgba(232,25,44,0.05) 1px, transparent 1px),
        linear-gradient(90deg, rgba(232,25,44,0.05) 1px, transparent 1px);
      background-size: 60px 60px;
      animation: gridMove 20s linear infinite;
      z-index: 0;
    }
    @keyframes gridMove {
      0% { background-position: 0 0; }
      100% { background-position: 60px 60px; }
    }
 
    .bg-glow {
      position: fixed;
      width: 600px; height: 600px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(232,25,44,0.15) 0%, transparent 70%);
      top: -100px; left: -100px;
      animation: glowMove 8s ease-in-out infinite alternate;
      z-index: 0;
    }
    @keyframes glowMove {
      0% { transform: translate(0, 0); }
      100% { transform: translate(200px, 150px); }
    }
 
    .wrapper {
      position: relative;
      z-index: 10;
      display: flex;
      width: 900px;
      max-width: 97vw;
      min-height: 560px;
      border-radius: 20px;
      overflow: hidden;
      box-shadow: 0 30px 80px rgba(0,0,0,0.7), 0 0 0 1px var(--border);
    }
 
    /* LEFT PANEL */
    .panel-left {
      flex: 1;
      background: linear-gradient(150deg, #1a0408 0%, #0a0a0a 60%);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 48px 40px;
      position: relative;
      overflow: hidden;
    }
 
    .panel-left::before {
      content: '';
      position: absolute;
      top: -60px; right: -60px;
      width: 250px; height: 250px;
      border-radius: 50%;
      border: 40px solid rgba(232,25,44,0.08);
    }
    .panel-left::after {
      content: '';
      position: absolute;
      bottom: -80px; left: -40px;
      width: 200px; height: 200px;
      border-radius: 50%;
      border: 30px solid rgba(232,25,44,0.06);
    }
 
    .logo-badge {
      width: 72px; height: 72px;
      background: var(--red);
      border-radius: 16px;
      display: flex; align-items: center; justify-content: center;
      font-size: 32px;
      margin-bottom: 20px;
      box-shadow: 0 0 40px rgba(232,25,44,0.4);
      animation: pulse 3s ease-in-out infinite;
    }
    @keyframes pulse {
      0%, 100% { box-shadow: 0 0 30px rgba(232,25,44,0.3); }
      50% { box-shadow: 0 0 60px rgba(232,25,44,0.6); }
    }
 
    .brand-title {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 42px;
      letter-spacing: 3px;
      line-height: 1;
      text-align: center;
      margin-bottom: 10px;
    }
    .brand-title span { color: var(--red); }
 
    .brand-tagline {
      color: var(--muted);
      font-size: 13px;
      letter-spacing: 2px;
      text-transform: uppercase;
      text-align: center;
      margin-bottom: 40px;
    }
 
    .stats {
      display: flex;
      gap: 30px;
      margin-top: 20px;
    }
    .stat { text-align: center; }
    .stat-num {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 30px;
      color: var(--red);
    }
    .stat-label {
      font-size: 11px;
      color: var(--muted);
      letter-spacing: 1px;
      text-transform: uppercase;
    }
 
    .divider-v {
      width: 1px;
      background: var(--border);
      align-self: stretch;
    }
 
    /* RIGHT PANEL – form */
    .panel-right {
      flex: 1.1;
      background: var(--card);
      padding: 50px 44px;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }
 
    /* Tab toggle */
    .tabs {
      display: flex;
      background: var(--border);
      border-radius: 10px;
      padding: 4px;
      margin-bottom: 36px;
    }
    .tab-btn {
      flex: 1;
      padding: 10px;
      border: none;
      background: transparent;
      color: var(--muted);
      font-family: 'Barlow', sans-serif;
      font-size: 14px;
      font-weight: 600;
      letter-spacing: 1px;
      text-transform: uppercase;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.3s;
    }
    .tab-btn.active {
      background: var(--red);
      color: #fff;
      box-shadow: 0 4px 20px rgba(232,25,44,0.4);
    }
 
    /* Forms */
    .form-section { display: none; animation: fadeIn 0.4s ease; }
    .form-section.active { display: block; }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
 
    .form-title {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 30px;
      letter-spacing: 2px;
      margin-bottom: 6px;
    }
    .form-sub {
      color: var(--muted);
      font-size: 13px;
      margin-bottom: 28px;
    }
 
    .field { margin-bottom: 18px; }
    .field label {
      display: block;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 7px;
    }
    .field input, .field select {
      width: 100%;
      background: #0a0a0a;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 12px 16px;
      color: var(--text);
      font-family: 'Barlow', sans-serif;
      font-size: 15px;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    .field input:focus, .field select:focus {
      border-color: var(--red);
      box-shadow: 0 0 0 3px rgba(232,25,44,0.12);
    }
    .field input::placeholder { color: #333; }
 
    .field select option { background: #111; }
 
    .row-2 { display: flex; gap: 14px; }
    .row-2 .field { flex: 1; }
 
    .btn-main {
      width: 100%;
      padding: 14px;
      background: var(--red);
      border: none;
      border-radius: 10px;
      color: #fff;
      font-family: 'Bebas Neue', sans-serif;
      font-size: 18px;
      letter-spacing: 2px;
      cursor: pointer;
      margin-top: 8px;
      transition: all 0.2s;
      box-shadow: 0 6px 24px rgba(232,25,44,0.35);
    }
    .btn-main:hover {
      background: var(--accent);
      transform: translateY(-2px);
      box-shadow: 0 10px 30px rgba(232,25,44,0.5);
    }
    .btn-main:active { transform: translateY(0); }
 
    .alt-link {
      text-align: center;
      margin-top: 20px;
      font-size: 13px;
      color: var(--muted);
    }
    .alt-link span {
      color: var(--red);
      cursor: pointer;
      font-weight: 600;
      text-decoration: underline;
    }
 
    /* Responsive */
    @media (max-width: 700px) {
      .wrapper { flex-direction: column; }
      .panel-left { padding: 32px 24px; }
      .stats { gap: 20px; }
      .panel-right { padding: 32px 24px; }
      .divider-v { display: none; }
    }
  </style>
</head>
<body>
 
<div class="bg-grid"></div>
<div class="bg-glow"></div>
 
<div class="wrapper">
  <!-- LEFT BRAND PANEL -->
  <div class="panel-left">
    <div class="logo-badge">🏆</div>
    <div class="brand-title">Elite<span>Edge</span><br>Sports</div>
    <div class="brand-tagline">Academy of Champions</div>
    <div class="stats">
      <div class="stat">
        <div class="stat-num">12+</div>
        <div class="stat-label">Sports</div>
      </div>
      <div class="stat">
        <div class="stat-num">500+</div>
        <div class="stat-label">Athletes</div>
      </div>
      <div class="stat">
        <div class="stat-num">50+</div>
        <div class="stat-label">Coaches</div>
      </div>
    </div>
  </div>
 
  <div class="divider-v"></div>
 
  <!-- RIGHT FORM PANEL -->
  <div class="panel-right">
    <div class="tabs">
      <button class="tab-btn active" onclick="switchTab('login')">Login</button>
      <button class="tab-btn" onclick="switchTab('signup')">Sign Up</button>
    </div>
 
    <!-- LOGIN FORM -->
    <div class="form-section active" id="loginForm">
      <div class="form-title">Welcome Back</div>
      <div class="form-sub">Login to your athlete account</div>
 
      <div class="field">
        <label>Email Address</label>
        <input type="email" placeholder="you@example.com" id="loginEmail"/>
      </div>
      <div class="field">
        <label>Password</label>
        <input type="password" placeholder="••••••••" id="loginPass"/>
      </div>
 
      <button class="btn-main" onclick="handleLogin()">Enter The Arena →</button>
      <div class="alt-link">New athlete? <span onclick="switchTab('signup')">Create Account</span></div>
    </div>
 
    <!-- SIGNUP FORM -->
    <div class="form-section" id="signupForm">
      <div class="form-title">Join The Academy</div>
      <div class="form-sub">Start your championship journey today</div>
 
      <div class="row-2">
        <div class="field">
          <label>First Name</label>
          <input type="text" placeholder="Arjun" id="firstName"/>
        </div>
        <div class="field">
          <label>Last Name</label>
          <input type="text" placeholder="Singh" id="lastName"/>
        </div>
      </div>
 
      <div class="field">
        <label>Email Address</label>
        <input type="email" placeholder="you@example.com" id="signupEmail"/>
      </div>
 
      <div class="field">
        <label>Sport of Interest</label>
        <select id="sport">
          <option value="">-- Choose Your Sport --</option>
          <option>Cricket</option>
          <option>Football</option>
          <option>Basketball</option>
          <option>Tennis</option>
          <option>Badminton</option>
          <option>Swimming</option>
          <option>Athletics</option>
          <option>Kabaddi</option>
        </select>
      </div>
 
      <div class="field">
        <label>Password</label>
        <input type="password" placeholder="Create a strong password" id="signupPass"/>
      </div>
 
      <button class="btn-main" onclick="handleSignup()">Create My Account →</button>
      <div class="alt-link">Already a member? <span onclick="switchTab('login')">Login Here</span></div>
    </div>
  </div>
</div>
 
<script>
  function switchTab(tab) {
    document.querySelectorAll('.tab-btn').forEach((b, i) => {
      b.classList.toggle('active', (tab === 'login' && i === 0) || (tab === 'signup' && i === 1));
    });
    document.getElementById('loginForm').classList.toggle('active', tab === 'login');
    document.getElementById('signupForm').classList.toggle('active', tab === 'signup');
  }
 
  function handleLogin() {
    const email = document.getElementById('loginEmail').value.trim();

if (!email.includes('@gmail.com')) {
  alert('⚠️ Please re-enter a valid Gmail address!');
  return;
}
    const pass = document.getElementById('loginPass').value.trim();
    if (!email || !pass) {
      alert('⚠️ Please fill in all fields!');
      return;
    }
    // Go to main website page
    window.location.href = 'website.html';
  }

  function handleSignup() {
    const first = document.getElementById('firstName').value.trim();
    const last = document.getElementById('lastName').value.trim();
    const email = document.getElementById('signupEmail').value.trim();

if (!email.includes('@gmail.com')) {
  alert('⚠️ Please enter a valid Gmail address!');
  return;
}
    const sport = document.getElementById('sport').value;
    const pass = document.getElementById('signupPass').value.trim();
    if (!first || !last || !email || !sport || !pass) {
      alert('⚠️ Please fill in all fields!');
      return;
    }
    if (pass.length < 6) {
      alert('⚠️ Password must be at least 6 characters!');
      return;
    }
    alert('✅ Account created! Welcome to EliteEdge, ' + first + '!');
    window.location.href = 'website.html';
  }
</script>
</body>
</html>
